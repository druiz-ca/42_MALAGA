<!DOCTYPE html>
<html lang="es">
    <head>
        <title></title>
        <style>
            body{
                background-color: black;
                color: whitesmoke;
            }
        </style>
    </head>
    <body>
        <h1>Rellenar campos</h1>
        <input id="nombre">
        <input id="email">
        <button onclick="guardar()">Guardar</button>

        <h1>Borrar Usuario</h1>
        <input id="nombreBorrar">
        <button onclick="borrar()">Borrar</button>
        <p id="respBorrar"></p>

        <!--HTML Para relación entre recursos -->
        <h1>Buscar Posts de un Usuario</h1>
        <input id="nombreBuscar">
        <button onclick="buscarPosts()">Buscar</button>
        <p id="respBuscar"></p>

        <h1>Crear Post a un Usuario</h1>
        <input id="nombreBuscar">
        <input id="email">
        <button onclick="crearPost()">Crear</button>
        <p id="respBuscar"></p>

        <h1>Borrar Post de un Usuario</h1>
        <input id="nombreBuscar">
        <button onclick="borrarPost()">Borrar</button>
        <p id="respBuscar"></p>
        <!--------------------------------------------->

        <button onclick="consultar()">Consultar</button>
        <p id="resultado"></p>
        
        <script>
            function guardar(){
                const nombre = document.getElementById('nombre').value;
                const email = document.getElementById('email').value;
                fetch('http://localhost:3000/post', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, email})
                });
            }
            
            function borrar(){
                const nombre = document.getElementById('nombreBorrar').value;
                fetch('http://localhost:3000/delete/' + encodeURIComponent(nombre), {
                    method: 'DELETE',
                    headers: {
                        // envío el token (ficha, símbolo, o parte más pequeña
                        //de un texto) al
                        //  BACK y soloa actúa tras comprobarlo
                        'Authorization': 'mi_token'
                    }
                })
                .then(respuesta => respuesta.text())// text sin () no va!!!
                .then(respText => document.getElementById('respBorrar').innerHTML = respText)
            }

            function buscarPosts(){
                const nombreBuscado = document.getElementById('nombre').value;
                fetch('http://localhost:3000/get/' + encodeURIComponent(nombreBuscado))
                .then(respuesta => respuesta.text)
                .then(respText => document.getElementById('resultado').innerText = respText)
            }

            function crearPost(){
                const nombre = document.getElementById('nombre').value;
                const email = document.getElementById('email').value;
                fetch('http://localhost:3000/post')
            }

            }

            function consultar(){
                fetch('http://localhost:3000/get')
                .then(respuesta => respuesta.text())
                .then(respText => document.getElementById('resultado').innerText = respText)
            }
        </script>
    </body>
</html>
