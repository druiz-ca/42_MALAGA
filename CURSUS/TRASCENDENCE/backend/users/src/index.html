<!DOCTYPE html>
<html>
<head>
  <title>Probar API Usuarios</title>
</head>
<body>
  <h1>Registro de usuario</h1>
  <input id="username" placeholder="Usuario">
  <input id="email" placeholder="Email">
  <button onclick="registerUser()">Registrar</button>
  <pre id="result"></pre>

  <h2>Listar usuarios</h2>
  <button onclick="listUsers()">Ver usuarios</button>
  <pre id="users"></pre>

  <script>
    function registerUser() {
      fetch('http://localhost:3000/users/register', 
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(
        {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value
        })
      })
      .then(res => res.json())
      .then(data => document.getElementById('result').textContent = JSON.stringify(data, null, 2));
    }

    function listUsers() {
      fetch('http://localhost:3000/users')
        .then(res => res.json())
        .then(data => document.getElementById('users').textContent = JSON.stringify(data, null, 2));
    }
  </script>
</body>
</html>
