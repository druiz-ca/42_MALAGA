<!DOCTYPE html>
<html lang="es">
    <head>
        <style>
            body{
                background-color: black;
                color: whitesmoke;
            }
            input, button{
                display: block;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Registro</h1>
        <input id="nombre" placeholder="nombre">
        <input id="email" placeholder="email">
        <input id="password" placeholder="password">
        <button onclick="registrarse()">registrarse</button>

        <h1>Login</h1>
        <input id="emailLogin" placeholder="email">
        <input id="passLogin" placeholder="password">
        <button onclick="login()">Login</button>
        
        <p id="respuesta"></p>


        <h1>Ver Perfil</h1>
        <button onclick="verPerfil()">Ver Perfil</button>
        

        <script>
            function registrarse(){
                const nombre = document.getElementById('nombre').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                fetch('http://localhost:3000/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre, email, password})
                })
                .then(respuesta => respuesta.text())
                .then(respText => document.getElementById('respuesta').innerText = respText);
            }

            async function login(){
                const email = document.getElementById('emailLogin').value;
                const password = document.getElementById('passLogin').value;
                
                const respuesta = await fetch('http://localhost:3000/login', {
                    method:'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                })
                /* // si espuera respuesta entonces se usa '.then'
                .then(respuesta => respuesta.text())
                .then(respText => document.getElementById('respuesta').innerText = respText);

                // Recibe el token del back
                    // Convierte la respuesta a JSON para poder
                    // acceder a sus propiedades
                const respuestaText = await respuesta.json();
                if(respuestaText.token){
                    // guarda el token en el almacenamineto local del navegador
                    // para no tener que generar un nuevo token en cada solicitud/
                    localStorage.setItem('token', respuestaText.token);
                    alert('Login correcto');
                } else {
                    alert('Login fallido');
                } */

                let data;
                try {
                    data = await respuesta.json();
                } catch {
                    document.getElementById('respuesta').innerText = "Login fallido";
                    return;
                }

                if(data.token){
                    localStorage.setItem('token', data.token);
                    document.getElementById('respuesta').innerText = "Login correcto";
                    alert('Login correcto');
                } else {
                    document.getElementById('respuesta').innerText = data || "Login fallido";
                    alert('Login fallido');
                }
            }
        
            async function verPerfil(){
                const token = localStorage.getItem('token');
                const respuesta = await fetch('http://localhost:3000/profile', {
                    headers: {'Authorization': token}});

                if(respuesta.ok){
                    const datos = await respuesta.json();
                    alert('Perfil: ' + JSON.stringify(datos));
                }else{
                    alert('No autorizado o token inválido');
                }
            }
        </script>
    </body>
</html>
